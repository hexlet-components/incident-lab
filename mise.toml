[tools]
node = "26"
pnpm = "12"
hk = "2"
pkl = "latest"
hadolint = "latest"
typos = "latest"
rumdl = "latest"
lychee = "latest"
jactionlint = "latest"
betterleaks = "latest"
osv-scanner = "latest"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"

[tasks.setup]
description = "Установить зависимости"
run = ["pnpm install --frozen-lockfile", "hk install"]

[tasks.check]
description = "Проверить типы, линтер и тесты"
run = ["hk check --all", "pnpm test"]

[tasks.fix]
description = "Отформатировать код"
run = "hk fix --all"
